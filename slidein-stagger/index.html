<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GSAP for Dummies" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Slide-In Toggle</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .container {
            height: auto;
        }

        .panels {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            will-change: transform;
        }

        .panel {
            width: 800px;
            max-width: 50%;

            opacity: 0;
        }
    </style>

    <script type="module" src="../app.js"></script>
</head>

<body>

    <header>
        <nav>
            <a href="./index.html">HOME</a>
        </nav>

        <h1>Slide-In Toggle</h1>

        <div class="empty">
            This is the header content. Scroll down to see the panels in action.

            <br><br>

            <a href="#one">One</a><br>
            <a href="#two">Two</a><br>
        </div>
    </header>

    <main>
        <div id="one" class="container container1" data-gsap="slidein">
            <div class="wrapper">
                <div class="panels" data-gsap-slidein="content">
                    <section class="panel panel1">Panel 1</section>
                    <section class="panel panel2">Panel 2</section>
                    <section class="panel panel3">Panel 3</section>
                </div>
            </div>
        </div>

        <div class="empty">Middle content</div>

        <div id="two" class="container container2" data-gsap="slidein" data-gsap-slidein-options='{ "reverse": true }'>
            <div class="wrapper">
                <div class="panels" data-gsap-slidein="content">
                    <section class="panel panel1">Panel 1</section>
                    <section class="panel panel2">Panel 2</section>
                    <section class="panel panel3">Panel 3</section>
                    <section class="panel panel4">Panel 4</section>
                    <section class="panel panel5">Panel 5</section>
                </div>
            </div>
        </div>
    </main>

    <footer>
        Footer Content
    </footer>

</body>

</html>
